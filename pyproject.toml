[project]
name = "climate-trace-etl"
version = "0.1.0"
description = "ELT pipeline that extracts Climate TRACE corporate emission assets and loads analytics marts into MotherDuck (DuckDB Cloud)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "onhorou" }]
keywords = ["climate-trace", "emissions", "motherduck", "duckdb", "elt", "data-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.5",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pandas>=2.2",
  "duckdb>=1.1",
  "loguru>=0.7",
]

[project.scripts]
run-etl = "climate_trace_etl.main:main"
check-motherduck = "climate_trace_etl.diagnostics:main"

[project.urls]
Homepage = "https://github.com/onhorou/climatetrace-to-motherduck"
Repository = "https://github.com/onhorou/climatetrace-to-motherduck"
Issues = "https://github.com/onhorou/climatetrace-to-motherduck/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]
# Runtime extras of the Streamlit dashboard (streamlit_app.py). PEP 735 groups are installed by
# default, so `poetry install` already provides them; Streamlit Community Cloud instead installs
# the same set from requirements.txt, which it prefers over pyproject.toml.
dashboard = [
  "plotly>=5.24",
  "pycountry>=26.2",
  "streamlit>=1.49",
]

[tool.poetry]
packages = [{ include = "climate_trace_etl", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "C4", "UP", "SIM", "RET", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# The dashboard renders a Russian UI on purpose; Cyrillic strings, docstrings and comments are
# flagged as "ambiguous unicode" otherwise.
"streamlit_app.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_dashboard.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
docstring-code-format = true
